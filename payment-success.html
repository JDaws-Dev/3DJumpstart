<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - 3D Jumpstart</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .success-icon {
            color: #16a34a;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .status-processing {
            background: #fef3c7;
            color: #92400e;
        }
        .status-complete {
            background: #dcfce7;
            color: #166534;
        }
        .info-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }
        .label {
            color: #64748b;
        }
        .value {
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #ea580c;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #dc2626;
        }
        .loading {
            color: #64748b;
            font-style: italic;
        }
        .notice {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.75rem;
            }
            .success-icon {
                font-size: 2.5rem;
            }
            .info-row {
                flex-direction: column;
                gap: 0.25rem;
                padding: 0.75rem 0;
                border-bottom: 1px solid #e2e8f0;
            }
            .info-row:last-child {
                border-bottom: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }
            .container {
                padding: 1rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .btn {
                width: 100%;
                text-align: center;
                display: block;
                margin-top: 1.5rem;
            }
            .status-badge {
                font-size: 0.875rem;
                padding: 0.375rem 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="success-icon">✓</div>
            <h1>Thank you!</h1>
            <span class="status-badge status-processing" id="statusBadge">Processing</span>
        </div>

        <div class="info-box">
            <div class="info-row">
                <span class="label">Receipt #</span>
                <span class="value" id="receiptId">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">Total Paid</span>
                <span class="value" id="totalPaid">Processing...</span>
            </div>
        </div>

        <div class="notice">
            Your enrollment is confirmed! You'll receive a confirmation email with class details shortly.
        </div>

        <div id="enrollmentInfo">
            <h3>Enrolled Students:</h3>
            <p class="loading">Payment is being processed. Please refresh in a moment.</p>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap;">
            <a href="portal.html" class="btn">Back to Parent Portal</a>
            <button class="btn" onclick="location.reload()" style="background: #64748b; border: none; cursor: pointer;">Refresh</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hucjmggkasahwpjgnwia.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2ptZ2drYXNhaHdwamdud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTI2MDIsImV4cCI6MjA3MDE4ODYwMn0.hxFmoZexaKverih9crJfP9fjWItOTfC_6D_CM7hr_Rg';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        async function checkPayment() {
            if (!sessionId) {
                document.getElementById('receiptId').textContent = 'No session ID';
                document.getElementById('enrollmentInfo').innerHTML = '<p style="color: red;">Missing session ID</p>';
                return;
            }

            document.getElementById('receiptId').textContent = sessionId.substring(0, 20) + '...';
            
            // Wait 5 seconds for webhook to complete
            await new Promise(resolve => setTimeout(resolve, 5000));
            
            try {
                // Get payment
                const { data: payment } = await supabase
                    .from('payments')
                    .select('*')
                    .eq('stripe_object_id', sessionId)
                    .maybeSingle();

                if (payment) {
                    // Payment found - show success
                    document.getElementById('statusBadge').textContent = 'Complete';
                    document.getElementById('statusBadge').className = 'status-badge status-complete';
                    document.getElementById('totalPaid').textContent = `$${payment.amount || 0}`;

                    // Get enrollments
                    const { data: enrollments } = await supabase
                        .from('enrollments')
                        .select('*, students!inner(first_name, last_name, grade)')
                        .eq('parent_id', payment.parent_id)
                        .in('status', ['enrolled', 'pending'])
                        .order('created_at', { ascending: false });

                    if (enrollments && enrollments.length > 0) {
                        const enrollmentHtml = enrollments.map(e => {
                            const student = e.students;
                            const status = e.status === 'enrolled' ? 'Enrolled' : 'Pending (Balance Due)';
                            return `
                                <div style="padding: 0.5rem; background: #f1f5f9; margin: 0.5rem 0; border-radius: 0.5rem;">
                                    <strong>${student.first_name} ${student.last_name}</strong> - 
                                    Grade ${student.grade} - 
                                    ${e.class_time} - 
                                    <span style="color: ${e.status === 'enrolled' ? '#16a34a' : '#f59e0b'};">${status}</span>
                                </div>
                            `;
                        }).join('');
                        
                        document.getElementById('enrollmentInfo').innerHTML = `
                            <h3>Enrolled Students:</h3>
                            ${enrollmentHtml}
                        `;
                    } else {
                        // Try again in 3 seconds
                        setTimeout(() => location.reload(), 3000);
                    }
                } else {
                    // Payment not found yet - try again
                    document.getElementById('enrollmentInfo').innerHTML = `
                        <p style="color: #f59e0b;">Payment is being processed. Auto-refreshing...</p>
                    `;
                    setTimeout(() => location.reload(), 3000);
                }
            } catch (error) {
                console.error('Error:', error);
                setTimeout(() => location.reload(), 5000);
            }
        }

        // Check on load
        checkPayment();
    </script>
</body>
</html>
