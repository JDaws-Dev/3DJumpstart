<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Payment Successful • 3D Jumpstart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- If you have a shared stylesheet, keep this; otherwise the inline styles below are enough -->
  <!-- <link rel="stylesheet" href="portal.css" /> -->
  <style>
    :root{
      --bg:#f7f8fb; --card:#fff; --muted:#6b7280; --border:#e8ebf0;
      --brand:#ff7a1a; --ok:#12a150; --danger:#b42318;
    }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:#111827;margin:0}
    .wrap{max-width:860px;margin:40px auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 16px rgba(38,43,55,.05);padding:20px}
    h1{margin:0 0 .5rem 0;font-size:1.6rem}
    .muted{color:var(--muted)}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .pill{display:inline-block;padding:.25rem .6rem;border-radius:999px;font-weight:700;font-size:.8rem}
    .pill-ok{background:#e8f7ef;color:var(--ok);border:1px solid #c9eedc}
    .pill-warn{background:#fff6e5;color:#9a5e00;border:1px solid #ffe3b1}
    .btn{background:var(--brand);border:none;color:#fff;padding:.7rem 1rem;border-radius:10px;cursor:pointer;font-weight:700}
    .btn.secondary{background:#1118270d;color:#111827;border:1px solid var(--border)}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .details > div{background:#fafbfe;border:1px dashed var(--border);padding:.75rem;border-radius:10px}
    .list{margin-top:16px;border-top:1px dashed var(--border);padding-top:12px}
    .enroll{padding:.6rem 0;border-top:1px dashed #eef1f6}
    .small{font-size:.9rem}
    .center{display:flex;align-items:center;justify-content:center}
    .hidden{display:none}
    .icon{width:26px;height:26px;margin-right:.5rem}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="row" style="align-items:center">
        <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10Z" fill="#E8F7EF"/>
          <path d="m8.5 12.5 2.5 2.5 4.5-5" stroke="#12A150" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 style="margin:0">Thank you! <span id="status-pill" class="pill pill-ok">Payment received</span></h1>
      </div>

      <!-- Loading -->
      <p id="loading-state" class="muted">Finalizing your receipt…</p>

      <!-- Success -->
      <div id="success-state" class="hidden">
        <div class="details">
          <div><strong>Receipt #</strong><br><span id="order-number" class="muted small">—</span></div>
          <div><strong>Total Paid</strong><br><span id="amount-paid" class="small">$—</span></div>
        </div>
        <div class="list">
          <div class="muted small" style="margin-bottom:.5rem">
            Below is the enrollment status for each student. If you selected <strong>Pay Half Now</strong>,
            the status will show <em>Pending</em> until the final invoice posts (due Oct 15).
          </div>
          <div id="enroll-list"></div>
        </div>
        <div style="margin-top:16px;display:flex;gap:10px">
          <button class="btn" onclick="window.location.href='portal.html'">Back to Parent Portal</button>
          <button class="btn secondary" onclick="window.location.reload()">Refresh</button>
        </div>
      </div>

      <!-- Error -->
      <div id="error-state" class="hidden">
        <p class="pill pill-warn">We hit a snag</p>
        <p id="error-message" class="muted">Something went wrong. Please try again.</p>
        <div style="margin-top:10px"><button class="btn secondary" onclick="window.location.href='portal.html'">Return to Portal</button></div>
      </div>
    </div>
  </div>

<script>
/* ================== CONFIG ================== */
const SUPABASE_URL = 'https://hucjmggkasahwpjgnwia.supabase.co'; // TODO: set yours
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2ptZ2drYXNhaHdwamdud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTI2MDIsImV4cCI6MjA3MDE4ODYwMn0.hxFmoZexaKverih9crJfP9fjWItOTfC_6D_CM7hr_Rg';                    // TODO: set yours
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ================== HELPERS ================== */
const $ = (id) => document.getElementById(id);
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function qp(name){ return new URL(location.href).searchParams.get(name); }

/* ================== MAIN ================== */
(async function init(){
  try {
    const sessionId = qp('session_id');
    const { data: { user } } = await sb.auth.getUser();

    if (!user) {
      hide('loading-state'); hide('success-state'); show('error-state');
      $('error-message').textContent = 'Please sign in again to view your receipt.';
      return;
    }

    // If Stripe didn't include a session id (rare), still show success shell
    if (!sessionId) {
      hide('loading-state'); show('success-state');
      $('order-number').textContent = '—';
      $('amount-paid').textContent = '$—';
      $('status-pill').textContent = 'Recorded';
      return;
    }

    // Fetch enrollments tied to this checkout session
    let { data: rows, error } = await sb
      .from('enrollments')
      .select('id, student_id, class_time, status, paid_at, amount_final, payment_plan')
      .eq('parent_id', user.id)
      .eq('stripe_session_id', sessionId);

    if (error) throw error;

    // Poll briefly (up to ~6s) for webhook to flip pending→paid (full payments)
    const start = Date.now();
    while (rows && rows.length && rows.some(r => r.status !== 'paid') && Date.now() - start < 6000) {
      await new Promise(r => setTimeout(r, 800));
      const res = await sb
        .from('enrollments')
        .select('id, student_id, class_time, status, paid_at, amount_final, payment_plan')
        .eq('parent_id', user.id)
        .eq('stripe_session_id', sessionId);
      rows = res.data || rows;
    }

    // Load student names for display
    const ids = [...new Set((rows||[]).map(r => r.student_id))];
    const { data: students } = ids.length
      ? await sb.from('students').select('id, first_name, last_name').in('id', ids)
      : { data: [] };

    hide('loading-state');

    // If no rows matched yet, still show a receipt shell so this page feels successful
    if (!rows || !rows.length) {
      show('success-state');
      $('order-number').textContent = sessionId.slice(0, 12) + '…';
      $('amount-paid').textContent = '$—';
      $('status-pill').textContent = 'Recorded';
      $('status-pill').className = 'pill pill-warn';
      $('enroll-list').innerHTML =
        `<div class="enroll muted">We’re finalizing your receipt. If it doesn’t appear in a minute, return to the Parent Portal.</div>`;
      return;
    }

    // Compute what was paid (for full payments); half-plan shows deposit paid on Stripe but stays pending here
    const paidRows = rows.filter(r => r.status === 'paid');
    const totalPaid = paidRows.length
      ? paidRows.reduce((sum, r) => sum + (r.amount_final ?? (r.payment_plan === 'full' ? 670 : 360)), 0)
      : 0;

    show('success-state');
    $('order-number').textContent = sessionId.slice(0, 12) + '…';
    $('amount-paid').textContent = paidRows.length ? `$${totalPaid.toLocaleString()}` : '$—';

    // If everything is paid, keep green pill, else warn/pending
    if (rows.every(r => r.status === 'paid')) {
      $('status-pill').textContent = 'Payment received';
      $('status-pill').className = 'pill pill-ok';
    } else {
      $('status-pill').textContent = 'Pending';
      $('status-pill').className = 'pill pill-warn';
    }

    // Render each enrollment line
    $('enroll-list').innerHTML = rows.map(r => {
      const s = students?.find(x => x.id === r.student_id);
      const name = s ? `${s.first_name} ${s.last_name}` : 'Student';
      const st = r.status === 'paid' ? 'Paid' : 'Pending';
      const when = r.paid_at ? ` • ${new Date(r.paid_at).toLocaleString()}` : '';
      return `<div class="enroll">
        <div><strong>${name}</strong> — ${r.class_time}</div>
        <div class="muted small">${st}${when}${r.payment_plan==='half' && st==='Pending' ? ' • Deposit received; final due Oct 15' : ''}</div>
      </div>`;
    }).join('');

  } catch (err) {
    console.error(err);
    hide('loading-state'); hide('success-state'); show('error-state');
    $('error-message').textContent = err.message || 'Something went wrong.';
  }
})();
</script>
</body>
</html>
