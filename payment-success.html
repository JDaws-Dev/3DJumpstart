<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - 3D Jumpstart</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .success-icon {
            color: #16a34a;
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .status-processing {
            background: #fef3c7;
            color: #92400e;
        }
        .status-complete {
            background: #dcfce7;
            color: #166534;
        }
        .info-box {
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
        }
        .label {
            color: #64748b;
        }
        .value {
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background: #ea580c;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 600;
            margin-top: 1rem;
        }
        .btn:hover {
            background: #dc2626;
        }
        .loading {
            color: #64748b;
            font-style: italic;
        }
        .notice {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="success-icon">✓</div>
            <h1>Thank you!</h1>
            <span class="status-badge status-processing" id="statusBadge">Processing</span>
        </div>

        <div class="info-box">
            <div class="info-row">
                <span class="label">Receipt #</span>
                <span class="value" id="receiptId">Loading...</span>
            </div>
            <div class="info-row">
                <span class="label">Total Paid</span>
                <span class="value" id="totalPaid">Processing...</span>
            </div>
        </div>

        <div class="notice">
            If you selected <strong>Pay Half Now</strong>, status shows <em>Pending</em> until your final payment posts (due Oct 15).
        </div>

        <div id="enrollmentInfo">
            <h3>Enrolled Students:</h3>
            <p class="loading">Payment is being processed. Please refresh in a moment.</p>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <a href="portal.html" class="btn">Back to Parent Portal</a>
            <button class="btn" onclick="location.reload()" style="background: #64748b;">Refresh</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hucjmggkasahwpjgnwia.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2ptZ2drYXNhaHdwamdud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTI2MDIsImV4cCI6MjA3MDE4ODYwMn0.hxFmoZexaKverih9crJfP9fjWItOTfC_6D_CM7hr_Rg';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Get session ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');

        async function checkPayment() {
            if (!sessionId) {
                document.getElementById('receiptId').textContent = 'No session ID';
                document.getElementById('enrollmentInfo').innerHTML = '<p style="color: red;">Missing session ID</p>';
                return;
            }

            // Display session ID immediately
            document.getElementById('receiptId').textContent = sessionId.substring(0, 20) + '...';

            try {
                // Check for payment with this stripe_object_id
                const { data: payment, error: payError } = await supabase
                    .from('payments')
                    .select('*')
                    .eq('stripe_object_id', sessionId)
                    .single();

                if (payment) {
                    // Payment found!
                    document.getElementById('statusBadge').textContent = 'Complete';
                    document.getElementById('statusBadge').className = 'status-badge status-complete';
                    document.getElementById('totalPaid').textContent = `$${payment.amount || 0}`;

                    // Check for enrollments
                    const { data: enrollments } = await supabase
                        .from('enrollments')
                        .select(`
                            *,
                            students:student_id (
                                first_name,
                                last_name,
                                grade
                            )
                        `)
                        .eq('stripe_session_id', sessionId);

                    if (enrollments && enrollments.length > 0) {
                        const enrollmentHtml = enrollments.map(e => {
                            const student = e.students || {};
                            const status = e.status === 'enrolled' ? 'Enrolled' : 
                                          e.status === 'pending' ? 'Pending (Balance Due)' : e.status;
                            return `
                                <div style="padding: 0.5rem; background: #f1f5f9; margin: 0.5rem 0; border-radius: 0.5rem;">
                                    <strong>${student.first_name || ''} ${student.last_name || ''}</strong> - 
                                    Grade ${student.grade || '?'} - 
                                    ${e.class_time || 'Time TBD'} - 
                                    <span style="color: ${e.status === 'enrolled' ? '#16a34a' : '#f59e0b'};">${status}</span>
                                </div>
                            `;
                        }).join('');

                        document.getElementById('enrollmentInfo').innerHTML = `
                            <h3>Enrolled Students:</h3>
                            ${enrollmentHtml}
                        `;
                    } else {
                        // Payment exists but enrollments not updated yet
                        document.getElementById('enrollmentInfo').innerHTML = `
                            <h3>Enrolled Students:</h3>
                            <p style="color: #f59e0b;">Enrollment confirmation pending. Please refresh in a moment.</p>
                        `;
                        
                        // Auto-refresh after 3 seconds
                        setTimeout(() => location.reload(), 3000);
                    }
                } else {
                    // Payment not found yet - webhook probably still processing
                    document.getElementById('enrollmentInfo').innerHTML = `
                        <p style="color: #f59e0b;">Payment is being processed. This usually takes 5-10 seconds.</p>
                        <p style="color: #64748b; font-size: 0.875rem;">Auto-refreshing...</p>
                    `;
                    
                    // Auto-refresh after 3 seconds
                    setTimeout(() => location.reload(), 3000);
                }
            } catch (error) {
                console.error('Error checking payment:', error);
                document.getElementById('enrollmentInfo').innerHTML = `
                    <p style="color: red;">Error loading payment details. Please refresh.</p>
                `;
            }
        }

        // Check on load
        checkPayment();
    </script>
</body>
</html>
