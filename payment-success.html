<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Thank you • 3D Jumpstart</title>
  <style>
    :root{--ring:#e5e7eb;--ink:#0b1329;--muted:#6b7280;--brand:#ff7a00;--card:#fff;--bg:#f6f7fb;--shadow:0 8px 24px rgba(16,24,40,.06)}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    .wrap{max-width:980px;margin:32px auto;padding:0 20px}
    .card{background:var(--card);border:1px solid var(--ring);box-shadow:var(--shadow);border-radius:16px;padding:18px}
    .title{font-weight:800;font-size:36px;display:flex;align-items:center;gap:12px}
    .pill{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid #fde7d1;background:#fff7ed;color:#8a3c00;font-weight:700}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .box{border:1px dashed var(--ring);border-radius:12px;padding:12px;min-height:72px}
    .muted{color:var(--muted)}
    .btn{border:1px solid var(--ring);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
    .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">
        <span style="color:#22c55e">✔</span>
        <span>Thank you!</span>
        <span class="pill" id="statusBadge">Pending</span>
      </div>

      <div class="grid" style="margin-top:14px">
        <div class="box">
          <div class="muted" style="font-size:.9rem;margin-bottom:.35rem">Receipt #</div>
          <div id="receiptNum" style="font-weight:800">—</div>
        </div>
        <div class="box">
          <div class="muted" style="font-size:.9rem;margin-bottom:.35rem">Total Paid</div>
          <div id="totalPaid" style="font-weight:800">$—</div>
        </div>
      </div>

      <div class="card" style="margin-top:14px;background:#fff7ed;border:1px dashed #fde7d1">
        <div class="muted" style="line-height:1.6">
          If you selected <strong>Pay Half Now</strong>, status shows <em>Pending</em> until your final payment posts (due Oct 15).
        </div>
      </div>

      <div id="enrollmentsBox" class="muted" style="margin-top:12px">No enrollments found for this receipt yet.</div>

      <div class="grid" style="margin-top:16px">
        <button class="btn primary" onclick="goPortal()">Back to Parent Portal</button>
        <button class="btn" onclick="refresh()">Refresh</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  const SUPABASE_URL = "https://hucjmggkasahwpjgnwia.supabase.coL";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2ptZ2drYXNhaHdwamdud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTI2MDIsImV4cCI6MjA3MDE4ODYwMn0.hxFmoZexaKverih9crJfP9fjWItOTfC_6D_CM7hr_Rg";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const qs = new URLSearchParams(location.search);
  const sessionId = qs.get('session_id') || '';
  document.getElementById('receiptNum').textContent = sessionId || '—';

  async function loadReceipt(){
    if(!sessionId) return;

    // payments row inserted by webhook
    const { data, error } = await supabase
      .from('payments')
      .select('amount, status')
      .eq('stripe_session_id', sessionId)
      .maybeSingle();

    const badge = document.getElementById('statusBadge');
    const totalEl = document.getElementById('totalPaid');

    if(error){ console.error(error); badge.textContent='Pending'; return; }

    if(!data){ // not yet written – poll a few times
      badge.textContent='Pending';
      setTimeout(loadReceipt, 2000);
      return;
    }

    badge.textContent = (data.status || 'paid').replace('_',' ');
    totalEl.textContent = `$${(Number(data.amount||0)/100).toFixed(0)}`;
  }

  function goPortal(){ location.href = '/portal.html'; }
  function refresh(){ loadReceipt(); }

  loadReceipt();
  </script>
</body>
</html>
