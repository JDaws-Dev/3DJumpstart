<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Admin • Class Roster & Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ring:#e5e7eb; --ink:#0b1329; --muted:#6b7280;
    --brand:#ff7a00; --good:#16a34a; --warn:#ca8a04; --bad:#ef4444; --shadow:0 8px 24px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:22px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo img{height:28px}
  h1{font-size:30px;margin:8px 0 14px}
  .card{background:var(--card);border:1px solid var(--ring);box-shadow:var(--shadow);border-radius:16px;padding:16px;margin:14px 0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted)}
  .chip{display:inline-flex;align-items:center;border:1px solid var(--ring);border-radius:999px;padding:6px 12px;background:#fff;font-weight:700}
  .btn{border:1px solid var(--ring);background:#fff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;border:1px solid var(--ring);font-weight:700}
  .ok{background:#ecfdf5;border-color:#bbf7d0;color:#065f46}
  .pending{background:#fefce8;border-color:#fde047;color:#713f12}
  .no{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}
  table{width:100%;border-collapse:collapse}
  th,td{padding:.7rem;border-bottom:1px solid var(--ring);text-align:left}
  th{font-size:.9rem;color:var(--muted)}
  .right{margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/5969/5969020.png" alt="cube">
      <strong>3D JUMPSTART • Admin</strong>
    </div>
    <div class="row">
      <span class="chip" id="adminEmail">—</span>
      <button class="btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <h1>Class Roster & Payments</h1>

  <div class="row">
    <div class="muted">Session:</div>
    <select id="sessionSelect" class="btn">
      <option value="fall_2025" selected>Fall 2025</option>
      <!-- add more sessions here as you run them -->
    </select>
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn primary right" id="exportBtn">Export CSV</button>
  </div>

  <div id="gate" class="card" style="display:none">
    <div style="font-weight:800;margin-bottom:6px">Access Restricted</div>
    <div class="muted">Your account is not on the admin allowlist. Add your email to <code>ADMIN_EMAILS</code> in this file and/or add a proper RLS admin policy.</div>
  </div>

  <!-- Class cards render here -->
  <div id="classes"></div>

  <!-- Totals -->
  <div class="card" id="totalsCard" style="display:none">
    <div class="row" style="gap:20px;flex-wrap:wrap">
      <div class="chip">Total Enrolled: <span id="tEnrolled" style="font-weight:800;margin-left:6px">0</span></div>
      <div class="chip">Paid: <span id="tPaid" style="font-weight:800;margin-left:6px;color:var(--good)">0</span></div>
      <div class="chip">Pending: <span id="tPending" style="font-weight:800;margin-left:6px;color:var(--warn)">0</span></div>
      <div class="chip">Unpaid: <span id="tUnpaid" style="font-weight:800;margin-left:6px;color:var(--bad)">0</span></div>
      <div class="chip">$ Collected: <span id="tCollected" style="font-weight:800;margin-left:6px">$0</span></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/**
 * CONFIG — replace with your project values
 */
const SUPABASE_URL = "https://hucjmggkasahwpjgnwia.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2ptZ2drYXNhaHdwamdud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTI2MDIsImV4cCI6MjA3MDE4ODYwMn0.hxFmoZexaKverih9crJfP9fjWItOTfC_6D_CM7hr_Rg";

/**
 * Very light client-side gate. Add your admin emails here.
 * For real protection, add an RLS policy that grants SELECT to admins.
 */
const ADMIN_EMAILS = [
  "you@example.com",
  // "other-admin@example.com"
];

const CLASS_MAP = {
  "tue_430": "Tuesday 4:30–5:30 (Grades 4–7)",
  "tue_530": "Tuesday 5:30–6:30 (Grades 8–12)"
};

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;
let rowsForCsv = [];

/** Auth bootstrap */
(async function init(){
  const { data: { session } } = await supabase.auth.getSession();
  if(!session){
    // redirect to your login page if you have one
    // location.href = "/index.html";
  }
  currentUser = session?.user || null;
  document.getElementById('adminEmail').textContent = currentUser?.email || '—';

  const allowed = currentUser && ADMIN_EMAILS.map(s=>s.toLowerCase().trim()).includes((currentUser.email||"").toLowerCase());
  if(!allowed){
    document.getElementById('gate').style.display = 'block';
    return;
  }

  // Load initial
  await renderAdmin();
})();

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await supabase.auth.signOut();
  location.reload();
});
document.getElementById('refreshBtn').addEventListener('click', ()=>renderAdmin());
document.getElementById('sessionSelect').addEventListener('change', ()=>renderAdmin());
document.getElementById('exportBtn').addEventListener('click', exportCsv);

/** Main renderer */
async function renderAdmin(){
  const sessionKey = document.getElementById('sessionSelect').value;
  const classesBox = document.getElementById('classes');
  classesBox.innerHTML = '<div class="card muted">Loading…</div>';
  rowsForCsv = [];

  // 1) Fetch enrollments + student info for this session
  const { data: enrolls, error: e1 } = await supabase
    .from('enrollments')
    .select('id, class_period, status, students ( first_name, last_name, grade, age, parent_id )')
    .eq('session', sessionKey)
    .order('class_period', { ascending: true });

  if(e1){ classesBox.innerHTML = `<div class="card">Error loading enrollments.</div>`; console.error(e1); return; }

  // 2) Fetch payments and aggregate amount by parent_id (paid only)
  const { data: pays, error: e2 } = await supabase
    .from('payments')
    .select('parent_id, amount, status');

  if(e2){ console.error(e2); }

  const paidByParent = {};
  let totalCollected = 0;
  (pays||[]).filter(p => (p.status||'paid') === 'paid').forEach(p=>{
    const cents = Number(p.amount||0);
    paidByParent[p.parent_id] = (paidByParent[p.parent_id]||0) + cents;
    totalCollected += cents;
  });

  // Group enrollments by class_period
  const groups = {};
  (enrolls||[]).forEach(e=>{
    groups[e.class_period] = groups[e.class_period] || [];
    groups[e.class_period].push(e);
  });

  // Render
  classesBox.innerHTML = '';
  let tEnrolled=0, tPaid=0, tPending=0, tUnpaid=0;

  const periods = Object.keys(CLASS_MAP);
  for(const key of periods){
    const list = groups[key] || [];
    tEnrolled += list.length;

    // header
    const card = document.createElement('div');
    card.className = 'card';
    const paidCount = list.filter(x => x.status === 'paid').length;
    const pendCount = list.filter(x => x.status === 'pending').length;
    const unpaidCount = list.filter(x => !x.status || x.status === 'cart' || x.status === 'unpaid').length;
    tPaid += paidCount; tPending += pendCount; tUnpaid += unpaidCount;

    card.innerHTML = `
      <div class="row" style="margin-bottom:8px">
        <div style="font-weight:800">${CLASS_MAP[key] || key}</div>
        <div class="right">
          <span class="chip">Enrolled: <strong style="margin-left:6px">${list.length}</strong></span>
          <span class="chip">Paid: <strong style="margin-left:6px;color:var(--good)">${paidCount}</strong></span>
          <span class="chip">Pending: <strong style="margin-left:6px;color:var(--warn)">${pendCount}</strong></span>
          <span class="chip">Unpaid: <strong style="margin-left:6px;color:var(--bad)">${unpaidCount}</strong></span>
        </div>
      </div>
      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th style="width:34%">Student</th>
              <th style="width:10%">Grade</th>
              <th style="width:14%">Status</th>
              <th style="width:14%">Parent Paid</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    `;
    classesBox.appendChild(card);
    const tbody = card.querySelector('tbody');

    if(!list.length){
      tbody.innerHTML = `<tr><td colspan="5" class="muted">— No enrollments yet —</td></tr>`;
      continue;
    }

    list.forEach(e=>{
      const s = e.students || {};
      const parentPaidCents = paidByParent[s.parent_id] || 0;
      const parentPaid = `$${(parentPaidCents/100).toFixed(0)}`;
      const st = (e.status||'unpaid');
      const pillClass = st==='paid' ? 'ok' : (st==='pending' ? 'pending' : 'no');
      const notes = s.experience ? `${s.experience}` : '';

      tbody.insertAdjacentHTML('beforeend', `
        <tr>
          <td><strong>${s.first_name||''} ${s.last_name||''}</strong></td>
          <td>${s.grade||''}</td>
          <td><span class="pill ${pillClass}">${st[0].toUpperCase()+st.slice(1)}</span></td>
          <td>${parentPaid}</td>
          <td class="muted">${notes}</td>
        </tr>
      `);

      // Collect for CSV
      rowsForCsv.push({
        session: document.getElementById('sessionSelect').value,
        class_period: CLASS_MAP[e.class_period] || e.class_period,
        student_first: s.first_name || '',
        student_last: s.last_name || '',
        grade: s.grade || '',
        status: st,
        parent_paid_usd: (parentPaidCents/100).toFixed(0),
      });
    });
  }

  // Totals footer
  document.getElementById('totalsCard').style.display = 'block';
  document.getElementById('tEnrolled').textContent = tEnrolled;
  document.getElementById('tPaid').textContent = tPaid;
  document.getElementById('tPending').textContent = tPending;
  document.getElementById('tUnpaid').textContent = tUnpaid;
  document.getElementById('tCollected').textContent = `$${(totalCollected/100).toFixed(0)}`;
}

/** Simple CSV export of the rendered view */
function exportCsv(){
  if(!rowsForCsv.length){ alert('No data to export yet.'); return; }
  const headers = Object.keys(rowsForCsv[0]);
  const lines = [
    headers.join(','),
    ...rowsForCsv.map(r=>headers.map(h=>csvSafe(r[h])).join(','))
  ];
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `class-roster-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}
function csvSafe(v){
  const s = (v==null?'':String(v));
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
  return s;
}
</script>
</body>
</html>
