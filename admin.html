<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    nav button { margin-right: 1rem; }
    .tab { display: none; }
    .tab.active { display: block; }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <div id="auth-status"></div>

  <nav>
    <button onclick="showTab('classes')">Classes</button>
    <button onclick="showTab('students')">Students</button>
    <button onclick="showTab('parents')">Parents</button>
    <button onclick="showTab('orders')">Orders</button>
  </nav>

  <div id="classes" class="tab"></div>
  <div id="students" class="tab"></div>
  <div id="parents" class="tab"></div>
  <div id="orders" class="tab"></div>

  <script>
    const supabase = window.supabase.createClient(
      'https://YOUR-PROJECT-REF.supabase.co',
      'YOUR-PUBLIC-ANON-KEY'
    );

    async function init() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        document.getElementById('auth-status').innerText = 'Please log in.';
        return;
      }
      if (!user.user_metadata.is_admin) {
        document.getElementById('auth-status').innerText = 'Access denied.';
        return;
      }
      document.getElementById('auth-status').innerText = `Logged in as ${user.email} (Admin)`;

      loadClasses();
      loadStudents();
      loadParents();
      loadOrders();
      showTab('classes');
    }

    function showTab(tab) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
    }

    async function loadClasses() {
      const { data, error } = await supabase.from('class_slots').select('*');
      if (error) { console.error(error); return; }
      document.getElementById('classes').innerHTML = renderTable(data);
    }

    async function loadStudents() {
      const { data, error } = await supabase.from('students').select('*, parents(*)');
      if (error) { console.error(error); return; }
      document.getElementById('students').innerHTML = renderTable(data);
    }

    async function loadParents() {
      const { data, error } = await supabase.from('parents').select('*');
      if (error) { console.error(error); return; }
      document.getElementById('parents').innerHTML = renderTable(data);
    }

    async function loadOrders() {
      const { data, error } = await supabase.from('orders').select('*');
      if (error) { console.error(error); return; }
      document.getElementById('orders').innerHTML = renderTable(data);
    }

    function renderTable(rows) {
      if (!rows || rows.length === 0) return '<p>No data</p>';
      const cols = Object.keys(rows[0]);
      let html = '<table border="1"><tr>' + cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
      for (const row of rows) {
        html += '<tr>' + cols.map(c => `<td>${row[c]}</td>`).join('') + '</tr>';
      }
      html += '</table>';
      return html;
    }

    init();
  </script>
</body>
</html>
