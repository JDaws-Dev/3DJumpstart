<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - 3D Jumpstart</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        
        /* Header */
        .header {
            background: white;
            padding: 1rem 0;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 2rem;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ea580c;
        }
        
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-left: 4px solid #ea580c;
        }
        
        .stat-title {
            color: #64748b;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: #0f172a;
        }
        
        /* Sections */
        .section {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #0f172a;
        }
        
        /* Tables */
        .table-container {
            overflow-x: auto;
            margin-top: 1rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        th {
            background: #f8fafc;
            font-weight: 600;
            color: #374151;
        }
        
        tr:hover {
            background: #f8fafc;
        }
        
        /* Status badges */
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .status-enrolled {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }
        
        .status-cart {
            background: #e0e7ff;
            color: #3730a3;
        }
        
        /* Buttons */
        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.875rem;
        }
        
        .btn-primary {
            background: #ea580c;
            color: white;
        }
        
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        
        .btn-success {
            background: #16a34a;
            color: white;
        }
        
        .loading {
            color: #6b7280;
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }
        
        .error {
            color: #ef4444;
            background: #fef2f2;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #fecaca;
        }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0.5rem;
            }
            
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .section {
                padding: 1rem;
            }
            
            .section-title {
                font-size: 1.25rem;
            }
            
            .table-container {
                font-size: 0.875rem;
            }
            
            th, td {
                padding: 0.5rem;
            }
            
            table {
                min-width: 500px;
            }
            
            .stat-value {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 0.25rem;
            }
            
            .section {
                padding: 0.75rem;
            }
            
            .section-title {
                font-size: 1.125rem;
            }
            
            table {
                min-width: 400px;
            }
            
            th, td {
                padding: 0.375rem;
                font-size: 0.75rem;
            }
            
            .status-badge {
                font-size: 0.625rem;
                padding: 0.125rem 0.5rem;
            }
            
            .btn {
                padding: 0.375rem 0.75rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">3D Jumpstart Admin</div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Stats Overview -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Revenue</div>
                <div class="stat-value" id="totalRevenue">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Outstanding Balance</div>
                <div class="stat-value" id="outstandingBalance">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Students</div>
                <div class="stat-value" id="totalStudents">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Active Enrollments</div>
                <div class="stat-value" id="activeEnrollments">0</div>
            </div>
        </div>

        <!-- Class Roster -->
        <div class="section">
            <h2 class="section-title">Class Roster</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Parent</th>
                            <th>Grade</th>
                            <th>Class Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rosterTable">
                        <tr>
                            <td colspan="6" class="loading">Loading roster...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Payment History -->
        <div class="section">
            <h2 class="section-title">Recent Payments</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Student</th>
                            <th>Parent</th>
                            <th>Amount</th>
                            <th>Type</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="paymentsTable">
                        <tr>
                            <td colspan="6" class="loading">Loading payments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Export Options -->
        <div class="section">
            <h2 class="section-title">Export Data</h2>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <button class="btn btn-primary" onclick="exportRoster()">Export Roster (CSV)</button>
                <button class="btn btn-secondary" onclick="exportPayments()">Export Payments (CSV)</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hucjmggkasahwpjgnwia.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1Y2ptZ2drYXNhaHdwamdud2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2MTI2MDIsImV4cCI6MjA3MDE4ODYwMn0.hxFmoZexaKverih9crJfP9fjWItOTfC_6D_CM7hr_Rg';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let enrollments = [];
        let students = [];
        let parents = [];
        let payments = [];

        // Check admin access on load
        document.addEventListener('DOMContentLoaded', async () => {
            await checkAdminAccess();
            await loadDashboardData();
        });

        async function checkAdminAccess() {
            try {
                const { data: { session } } = await supabase.auth.getSession();
                
                if (!session || session.user.email !== 'jeremiah@3djumpstart.com') {
                    window.location.href = 'login.html';
                    return;
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html';
            }
        }

        async function loadDashboardData() {
            try {
                // Load all data separately to avoid join issues
                const [enrollmentsRes, studentsRes, parentsRes, paymentsRes] = await Promise.all([
                    supabase.from('enrollments').select('*').order('created_at', { ascending: false }),
                    supabase.from('students').select('*'),
                    supabase.from('parents').select('*'),
                    supabase.from('payments').select('*').order('created_at', { ascending: false })
                ]);

                if (enrollmentsRes.error) throw enrollmentsRes.error;
                if (studentsRes.error) throw studentsRes.error;
                if (parentsRes.error) throw parentsRes.error;
                if (paymentsRes.error) throw paymentsRes.error;

                enrollments = enrollmentsRes.data || [];
                students = studentsRes.data || [];
                parents = parentsRes.data || [];
                payments = paymentsRes.data || [];

                updateStats();
                renderRoster();
                renderPayments();

            } catch (error) {
                console.error('Failed to load dashboard data:', error);
                document.body.innerHTML = `<div class="container"><div class="error">Failed to load admin data: ${error.message}</div></div>`;
            }
        }

        function updateStats() {
            // Calculate stats
            const totalRevenue = payments.reduce((sum, p) => sum + (p.amount || 0), 0);
            const pendingEnrollments = enrollments.filter(e => e.status === 'pending');
            const outstandingBalance = pendingEnrollments.reduce((sum, e) => {
                // Assuming $360 remaining for pending payments
                return sum + 360;
            }, 0);
            const activeEnrollments = enrollments.filter(e => ['enrolled', 'pending'].includes(e.status));

            document.getElementById('totalRevenue').textContent = `$${totalRevenue}`;
            document.getElementById('outstandingBalance').textContent = `$${outstandingBalance}`;
            document.getElementById('totalStudents').textContent = students.length;
            document.getElementById('activeEnrollments').textContent = activeEnrollments.length;
        }

        function renderRoster() {
            const tbody = document.getElementById('rosterTable');
            const activeEnrollments = enrollments.filter(e => ['enrolled', 'pending'].includes(e.status));

            if (activeEnrollments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #6b7280;">No active enrollments</td></tr>';
                return;
            }

            tbody.innerHTML = activeEnrollments.map(enrollment => {
                const student = students.find(s => s.id === enrollment.student_id);
                const parent = parents.find(p => p.id === enrollment.parent_id);
                
                const studentName = student ? `${student.first_name} ${student.last_name}` : 'Unknown';
                const parentName = parent ? parent.name : 'Unknown';
                const grade = student ? student.grade : 'N/A';
                
                return `
                    <tr>
                        <td>${studentName}</td>
                        <td>${parentName}</td>
                        <td>${grade}</td>
                        <td>${enrollment.class_time || 'TBD'}</td>
                        <td><span class="status-badge status-${enrollment.status}">${enrollment.status}</span></td>
                        <td>
                            ${enrollment.status === 'pending' ? 
                                `<button class="btn btn-success" onclick="markAsEnrolled('${enrollment.id}')">Mark Enrolled</button>` : 
                                '<span style="color: #6b7280;">Complete</span>'
                            }
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPayments() {
            const tbody = document.getElementById('paymentsTable');

            if (payments.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #6b7280;">No payments yet</td></tr>';
                return;
            }

            tbody.innerHTML = payments.slice(0, 20).map(payment => {
                const enrollment = enrollments.find(e => e.id === payment.enrollment_id);
                const student = enrollment ? students.find(s => s.id === enrollment.student_id) : null;
                const parent = enrollment ? parents.find(p => p.id === enrollment.parent_id) : null;
                
                const studentName = student ? `${student.first_name} ${student.last_name}` : 'Unknown';
                const parentName = parent ? parent.name : 'Unknown';
                const date = new Date(payment.created_at).toLocaleDateString();
                
                return `
                    <tr>
                        <td>${date}</td>
                        <td>${studentName}</td>
                        <td>${parentName}</td>
                        <td>$${payment.amount || 0}</td>
                        <td>${payment.event_type || 'Payment'}</td>
                        <td><span class="status-badge status-enrolled">Complete</span></td>
                    </tr>
                `;
            }).join('');
        }

        async function markAsEnrolled(enrollmentId) {
            try {
                const { error } = await supabase
                    .from('enrollments')
                    .update({ status: 'enrolled' })
                    .eq('id', enrollmentId);

                if (error) throw error;

                // Reload data
                await loadDashboardData();
                alert('Student marked as enrolled successfully!');
            } catch (error) {
                console.error('Error updating enrollment:', error);
                alert('Failed to update enrollment status');
            }
        }

        function exportRoster() {
            const activeEnrollments = enrollments.filter(e => ['enrolled', 'pending'].includes(e.status));
            const csvData = activeEnrollments.map(enrollment => {
                const student = students.find(s => s.id === enrollment.student_id);
                const parent = parents.find(p => p.id === enrollment.parent_id);
                
                return {
                    'Student Name': student ? `${student.first_name} ${student.last_name}` : 'Unknown',
                    'Parent Name': parent ? parent.name : 'Unknown',
                    'Parent Email': parent ? parent.email : 'Unknown',
                    'Grade': student ? student.grade : 'N/A',
                    'Age': student ? student.age : 'N/A',
                    'Class Time': enrollment.class_time || 'TBD',
                    'Status': enrollment.status,
                    'Special Notes': student ? student.special || '' : ''
                };
            });

            downloadCSV(csvData, 'class-roster.csv');
        }

        function exportPayments() {
            const csvData = payments.map(payment => {
                const enrollment = enrollments.find(e => e.id === payment.enrollment_id);
                const student = enrollment ? students.find(s => s.id === enrollment.student_id) : null;
                const parent = enrollment ? parents.find(p => p.id === enrollment.parent_id) : null;
                
                return {
                    'Date': new Date(payment.created_at).toLocaleDateString(),
                    'Student Name': student ? `${student.first_name} ${student.last_name}` : 'Unknown',
                    'Parent Name': parent ? parent.name : 'Unknown',
                    'Amount': `$${payment.amount || 0}`,
                    'Payment Type': payment.event_type || 'Payment',
                    'Stripe ID': payment.stripe_object_id || ''
                };
            });

            downloadCSV(csvData, 'payment-history.csv');
        }

        function downloadCSV(data, filename) {
            if (data.length === 0) {
                alert('No data to export');
                return;
            }

            const headers = Object.keys(data[0]);
            const csvContent = [
                headers.join(','),
                ...data.map(row => headers.map(header => `"${row[header] || ''}"`).join(','))
            ].join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            window.URL.revokeObjectURL(url);
        }

        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
