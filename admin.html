<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="header">
    <h1>Admin Dashboard</h1>
    <nav>
      <button data-tab="orders">Orders</button>
      <button data-tab="enrollments">Enrollments</button>
      <button data-tab="payments">Payments</button>
      <button data-tab="classes">Classes</button>
      <button data-tab="students">Students</button>
      <button data-tab="parents">Parents</button>
    </nav>
  </header>
  <main>
    <section id="orders" class="tab"></section>
    <section id="enrollments" class="tab hidden"></section>
    <section id="payments" class="tab hidden"></section>
    <section id="classes" class="tab hidden"></section>
    <section id="students" class="tab hidden"></section>
    <section id="parents" class="tab hidden"></section>
  </main>
  <div id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
