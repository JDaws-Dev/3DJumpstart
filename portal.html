<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>3D Jumpstart – Parent Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* unified header + basic layout */
    :root { --brand:#ea580c; --ink:#111827; --muted:#6b7280; --card:#fff; --bg:#f5f7fb; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
    .container{ max-width:1100px; margin:0 auto; padding:0 1rem; }

    .portal-header{ background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); position:sticky; top:0; z-index:10; }
    .header-content{ display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:.75rem 0; }
    .logo-image{ height:40px; }
    .btn{ border:0; border-radius:.625rem; padding:.55rem .85rem; font-weight:600; cursor:pointer; }
    .btn-primary{ background:var(--brand); color:#fff; }
    .btn-secondary{ background:#4b5563; color:#fff; }
    .btn-outline{ background:#fff; color:var(--brand); border:2px solid var(--brand); }

    .tabs{ display:flex; gap:.5rem; margin:1.25rem 0; border-bottom:1px solid #e5e7eb; }
    .tab-button{ background:#fff; border:1px solid #e5e7eb; padding:.65rem 1rem; border-radius:.5rem .5rem 0 0; color:#374151; }
    .tab-button.active{ border-color:var(--brand); color:#111827; box-shadow:inset 0 -3px 0 var(--brand); }
    .tab-content{ display:none; }
    .tab-content.active{ display:block; }

    .card{ background:#fff; border:1px solid #e5e7eb; border-radius:1rem; padding:1.25rem; }
    .card-title{ font-size:1.25rem; font-weight:800; margin-bottom:.75rem; }

    .badge{ display:inline-block; padding:.125rem .5rem; border-radius:999px; font-size:.75rem; font-weight:700; }
    .badge-enrolled{ background:#dcfce7; color:#166534; border:1px solid #16a34a; }
    .badge-pending{ background:#fef3c7; color:#92400e; border:1px solid #f59e0b; }
    .badge-canceled{ background:#fee2e2; color:#991b1b; border:1px solid #ef4444; }

    .student{ display:flex; align-items:center; justify-content:space-between; padding:1rem; border:1px solid #e5e7eb; border-radius:.75rem; background:#fff; }
    .muted{ color:var(--muted); }
    h1{ font-size:2.25rem; margin:1.25rem 0; }
  </style>
</head>
<body>
  <header class="portal-header">
    <div class="container">
      <div class="header-content">
        <img src="https://raw.githubusercontent.com/JDaws-Dev/assets/main/3d-jumpstart-logo.png" alt="3D Jumpstart" class="logo-image">
        <div style="display:flex; gap:.5rem; align-items:center;">
          <span id="parent-name" class="muted">Loading...</span>
          <a class="btn btn-outline" href="app.html">Manage Students</a>
          <button class="btn btn-secondary" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <h1>Welcome to Your Parent Portal</h1>
    <div class="tabs">
      <button class="tab-button active" onclick="showTab('students')">My Students</button>
      <button class="tab-button" onclick="showTab('class-info')">Class Information</button>
      <button class="tab-button" onclick="showTab('support')">Support Services</button>
      <button class="tab-button" onclick="showTab('billing')">Billing</button>
      <button class="tab-button" onclick="showTab('contact')">Contact</button>
    </div>

    <section id="students-tab" class="tab-content active">
      <div class="card">
        <h2 class="card-title">Your Enrolled Students</h2>
        <div id="students-list"></div>
      </div>
    </section>

    <section id="class-info-tab" class="tab-content"><div class="card"><h2 class="card-title">Class Info</h2><p class="muted">Details here…</p></div></section>
    <section id="support-tab" class="tab-content"><div class="card"><h2 class="card-title">Support Services</h2><p class="muted">Details here…</p></div></section>
    <section id="billing-tab" class="tab-content"><div class="card"><h2 class="card-title">Billing</h2><div id="billing-list"></div></div></section>
    <section id="contact-tab" class="tab-content"><div class="card"><h2 class="card-title">Contact</h2><p class="muted">support@3djumpstart.com</p></div></section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <script src="portal.js"></script>
</body>
</html>
