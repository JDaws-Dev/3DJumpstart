<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Jumpstart — Parent Portal</title>

  <!-- Your CSS links stay as-is -->
  <style>
    .hidden { display: none !important; }
    .progress-step.active { font-weight: 700; }
    .progress-step.completed { opacity: 0.6; }
    .step-divider { display: inline-block; width: 24px; height: 2px; background: #e5e7eb; margin: 0 8px; vertical-align: middle; }
    .message { padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; }
    .message.success { background:#dcfce7; color:#166534; }
    .message.error { background:#fee2e2; color:#991b1b; }
    .message.info { background:#e0f2fe; color:#075985; }
    .badge { font-size:.75rem; background:#eef2ff; color:#3730a3; padding:.25rem .5rem; border-radius:9999px; }
    .btn { padding:.6rem 1rem; border:1px solid #e5e7eb; border-radius:.5rem; background:#111827; color:#fff; cursor:pointer; }
    .btn-outline { background:#fff; color:#111827; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .card { border:1px solid #e5e7eb; border-radius:12px; padding:1rem; background:#fff; }
    .grid { display:grid; gap:1rem; }
  </style>
</head>
<body>
  <div id="app" class="">

    <!-- Simple nav -->
    <nav style="display:flex; gap:8px; margin:12px 0;">
      <button class="nav-button btn btn-outline" data-section="students">Your Students</button>
      <button class="nav-button btn btn-outline" data-section="cart">Cart / Enroll</button>
      <span class="badge" id="cart-count" style="display:none;">0</span>
    </nav>

    <!-- Progress (optional visual) -->
    <div id="progress" style="margin: 8px 0;">
      <span id="step-students" class="progress-step active">Students</span>
      <span class="step-divider"></span>
      <span id="step-cart" class="progress-step">Cart</span>
      <span class="step-divider"></span>
      <span id="step-payment" class="progress-step">Payment</span>
      <span class="step-divider"></span>
      <span id="step-complete" class="progress-step">Complete</span>
    </div>

    <!-- Global message area -->
    <div id="global-message"></div>

    <!-- STUDENTS -->
    <section id="students-section" class="section">
      <div id="message-area"></div>
      <div id="students-grid" class="grid"></div>
    </section>

    <!-- CART / ENROLLMENT -->
    <section id="cart-section" class="section hidden">
      <div id="cart-message-area"></div>

      <div id="time-slot-availability" style="margin: 8px 0;"></div>

      <div id="cart-items" class="grid"></div>

      <div id="cart-summary" class="hidden" style="margin-top: 12px;">
        <div class="grid" style="grid-template-columns: repeat(2, minmax(0, 1fr));">
          <button id="payment-full"  class="payment-option btn btn-outline" onclick="selectPaymentOption('full')">Pay in Full</button>
          <button id="payment-split" class="payment-option btn btn-outline" onclick="selectPaymentOption('split')">Split Payment</button>
        </div>

        <button id="proceed-to-payment-btn" class="btn" style="margin-top: 12px;" disabled>Proceed to Payment</button>
      </div>
    </section>

    <!-- ORDERS HISTORY -->
    <section id="orders-section" style="margin-top: 24px;">
      <h3>Orders</h3>
      <div id="orders-list" class="grid"></div>
    </section>
  </div>

  <!-- If you still render a login form somewhere -->
  <div id="login-form" class="hidden"></div>

  <!-- Supabase + your app JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js"></script>
</body>
</html>
